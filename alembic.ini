[alembic]
script_location = studyapp/db/migrations
prepend_sys_path = .
path_separator = os
# A placeholder, and never the file that gets migrated. The app passes its own
# path through studyapp.db.connection.alembic_config; the bare `alembic` CLI
# passes nothing, and env.py recognises this exact value and falls back to the
# database the app opens. Changing it here means the CLI will believe it.
sqlalchemy.url = sqlite:///studyapp.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

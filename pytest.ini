# Puts the project root on sys.path, so `pytest tests/` imports `studyapp` from
# the checkout rather than needing it installed.
#
# Without this the suite only runs as `python -m pytest`, because `-m` puts the
# working directory on the path and the `pytest` console script does not. That
# is a trap rather than an inconvenience: both commands are spelled the same in
# the README, one of them passed here and the other failed on a clean checkout,
# and CI runs the one that failed.
[pytest]
pythonpath = .
